<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0b" />
  <title>FK Sava — Admin</title>
  <link rel="icon" href="assets/images/logo.png" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>
<body>
  <section class="login-shell" id="loginShell">
    <div class="login-card">
      <img src="assets/images/logo.png" alt="FK Sava" />
      <span class="kicker">FK SAVA · CMS V2</span>
      <h1>Klupska administracija</h1>
      <p>Utakmice, strelci, asistencije, igrači i galerije. Statistika igrača se računa automatski.</p>
      <label>Admin API URL<input id="apiUrl" inputmode="url" placeholder="https://fk-sava-admin-api.onrender.com" /></label>
      <label>Lozinka<input id="adminPassword" type="password" autocomplete="current-password" /></label>
      <button class="btn gold" id="loginBtn">Prijavi se</button>
      <p class="status" id="loginStatus"></p>
    </div>
  </section>

  <main class="admin-app" id="adminApp" hidden>
    <header class="admin-header">
      <div class="admin-brand"><img src="assets/images/logo.png" alt=""><div><b>FK SAVA</b><small>ADMIN · SEZONA <span id="seasonLabel"></span></small></div></div>
      <div class="header-actions">
        <span class="save-state" id="saveState">Sačuvano</span>
        <button class="btn ghost" id="reloadBtn">↻ Učitaj sa GitHub-a</button>
        <button class="btn gold" id="publishBtn">Objavi promene</button>
      </div>
    </header>

    <div class="admin-layout">
      <aside class="sidebar">
        <label class="year-label">GODIŠTE<select id="yearSelect"></select></label>
        <nav class="admin-tabs">
          <button data-tab="players" class="active">👥 Igrači</button>
          <button data-tab="matches">⚽ Utakmice</button>
          <button data-tab="gallery">📷 Galerija</button>
        </nav>
        <div class="sidebar-note"><b>Važno</b><p>Golovi, asistencije i nastupi se ne upisuju ručno. Računaju se iz utakmica.</p></div>
        <div class="sidebar-tools">
          <button class="text-btn" id="exportBtn">Izvezi JSON backup</button>
          <button class="text-btn" id="importBtn">Uvezi JSON backup</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </aside>

      <section class="workspace">
        <div id="workspaceContent"></div>
      </section>
    </div>
  </main>

  <div class="editor-modal" id="editorModal" aria-hidden="true">
    <div class="editor-card">
      <button class="close-editor" id="closeEditor" aria-label="Zatvori">×</button>
      <div id="editorContent"></div>
    </div>
  </div>

  <script src="assets/js/admin.js"></script>
</body>
</html>
